# OWASP CRS Plugin Descriptor
# https://github.com/coreruleset/plugin-registry

schema_version: 1

plugin:
  name: "sogo-rule-exclusions-plugin"
  description: "OWASP CRS rule exclusions for SOGo Groupware"
  long_description: Provides rule-exclusions for common false positives with SOGo Groupware.
  type: "3rd-party"
  category: "rule-exclusion"
  status: "tested"
  license: "GPL-2.0"
  authors:
    - name: "Esad Cetiner"
      url: "https://github.com/EsadCetiner"
  repository: "https://github.com/EsadCetiner/sogo-rule-exclusions-plugin"
  keywords:
    - "sogo-groupware"
    - "webmail"
    - "groupware"
    - "rule-exclusion"
    - "false-positive"

rule_id_range:
  start: 9520000
  end: 9520999

compatibility:
  crs_version: ">=4.0.0"

configuration:
  file: "plugins/sogo-rule-exclusions-config.conf"
  variables:
    - name: "tx.sogo-rule-exclusions-plugin"
      type: "boolean"
      default: 1
      description: "Enables the plugin's rule exclusions; set to 0 to disable them and re-enable the excluded CRS rules"
